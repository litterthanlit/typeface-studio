        </div>
        <button class="btn btn-accent" style=${{ height: '42px' }} disabled=${busy || downloads === undefined} onClick=${saveFont}><${Icon} name="save" size=${17} /> Save font (.ttf)</button>
        <button class="btn" disabled=${busy || downloads === undefined} onClick=${saveProject}><${Icon} name="box" size=${16} /> Save project file (.json)</button>
        ${downloads === null && html`<p class="hint">Saving files works when this page is open on claude.ai.</p>`}
        ${persistMode !== 'db' && html`<p class="hint">Projects on this device live in browser storage, which can be cleared. Save the project file to keep a copy.</p>`}
        <div style=${{ display: 'grid', gap: '8px' }}>
          <span class="label">Checks</span>
          <ul class="diag">
            ${diags.length === 0 && html`<li class="ok">No problems found.</li>`}
            ${diags.map((d, i) => html`<li key=${i} class=${d.level === 'info' ? 'info' : ''}>${d.msg}</li>`)}
          </ul>
        </div>
        <details class="install">
          <summary>How to install it</summary>
          <ol>
            <li>macOS: double-click the .ttf and choose Install Font in Font Book.</li>
            <li>Windows: right-click the .ttf and choose Install.</li>
            <li>Updating? Raise the version number, remove the old install, then install the new file.</li>
            <li>On the web, use it with @font-face. TrueType works in every current browser.</li>
          </ol>
        </details>
      </section>
    </div>
  </div>`;
}

const TABS = [['glyphs', 'Glyphs', 'glyphs'], ['edit', 'Edit', 'pen'], ['spacing', 'Spacing', 'spacing'], ['test', 'Test', 'type'], ['export', 'Export', 'save']];

function App() {
  const initial = useMemo(() => Core.sansProject('Studio Sans'), []);
  const [project, setProject] = useState(initial);
  const projectRef = useRef(project);
  const draftRef = useRef(true), draftBase = useRef(initial);
  const [isDraft, setIsDraft] = useState(true);
  const savedRef = useRef(null);
  const hist = useRef({ past: [], future: [] });
  const gesture = useRef(null);
  const [, setHistVer] = useState(0);
  const [view, setView] = useState('glyphs');
  const [glyphId, setGlyphId] = useState(null);
  const [persist, setPersist] = useState({ mode: 'pending', state: 'idle', message: null });
  const [projects, setProjects] = useState([]);
  const [drawer, setDrawer] = useState(false);
  const [toastMsg, setToastMsg] = useState(null);
  const [live, setLive] = useState('');
  const [downloads, setDownloads] = useState(undefined);
  const font = useCompiledFont(project);
  const toastTimer = useRef(null);
  const toast = useCallback((msg) => { setToastMsg(msg); setLive(msg); clearTimeout(toastTimer.current); toastTimer.current = setTimeout(() => setToastMsg(null), 2800); }, []);
  const announce = useCallback((msg) => setLive(msg), []);

  const resetHistory = () => { hist.current = { past: [], future: [] }; gesture.current = null; setHistVer((v) => v + 1); };
  const commit = useCallback((next, record = true) => {
    const prev = projectRef.current;
    if (next === prev) return;
    if (record && !gesture.current) {
      const h = hist.current;
      h.past.push(prev); if (h.past.length > 100) h.past.shift();
      h.future = [];
      setHistVer((v) => v + 1);
    }
    projectRef.current = next;
    setProject(next);
  }, []);
  const api = useMemo(() => ({
    get: () => projectRef.current,
    commit,
    setGlyph: (g, record = true) => { const p = projectRef.current; commit({ ...p, glyphs: { ...p.glyphs, [g.id]: g } }, record); },
    begin: () => { if (!gesture.current) gesture.current = { base: projectRef.current }; },
    end: () => {
      const g = gesture.current;
      gesture.current = null;
      if (g && projectRef.current !== g.base) {
        const h = hist.current;
        h.past.push(g.base); if (h.past.length > 100) h.past.shift();
        h.future = [];
        setHistVer((v) => v + 1);
      }
    },
    cancel: () => { const g = gesture.current; gesture.current = null; if (g) { projectRef.current = g.base; setProject(g.base); } },
  }), [commit]);
  const undo = useCallback(() => {
    const h = hist.current;
    if (gesture.current || !h.past.length) return;
    const prev = h.past.pop();
    h.future.push(projectRef.current);
    projectRef.current = prev; setProject(prev); setHistVer((v) => v + 1);
    setLive('Undone');
  }, []);
  const redo = useCallback(() => {
    const h = hist.current;
    if (gesture.current || !h.future.length) return;
    const next = h.future.pop();
    h.past.push(projectRef.current);
    projectRef.current = next; setProject(next); setHistVer((v) => v + 1);
    setLive('Redone');
  }, []);

  // persistence
  useEffect(() => {
    if (draftRef.current) {
      if (project === draftBase.current) return;
      draftRef.current = false; setIsDraft(false);
      savedRef.current = project;
      Persist.saveAll(project);
      return;
    }
    if (savedRef.current !== project) { Persist.saveDiff(savedRef.current, project); savedRef.current = project; }
  }, [project]);
  const openProject = useCallback(async (id) => {
    Persist.flush();
    try {
      const p = await Persist.load(id);
      draftRef.current = false; setIsDraft(false);
      savedRef.current = p; projectRef.current = p; setProject(p);
      resetHistory(); setGlyphId(null); setView('glyphs'); setDrawer(false);
    } catch (e) { toast(e.message || 'That typeface didn’t open.'); }
  }, []);
  const refreshList = useCallback(() => Persist.list().then(setProjects, () => {}), []);
  useEffect(() => {
    const un = Persist.subscribe(setPersist);
    Persist.setFallbackHook(() => { if (!draftRef.current) Persist.saveAll(projectRef.current); });
    Persist.init().then(async () => {
      if (!draftRef.current) Persist.saveAll(projectRef.current);
      let list = [];
      try { list = await Persist.list(); } catch {}
      setProjects(list);
      if (list.length && draftRef.current && projectRef.current === draftBase.current) openProject(list[0].id);
    });
    (async () => {
      try { setDownloads(window.claude && window.claude.use ? await window.claude.use('downloads') : null); }
      catch { setDownloads(null); }
    })();
    const flush = () => { if (document.visibilityState === 'hidden') Persist.flush(); };
    document.addEventListener('visibilitychange', flush);
    window.addEventListener('pagehide', Persist.flush);
    return () => { un(); document.removeEventListener('visibilitychange', flush); window.removeEventListener('pagehide', Persist.flush); };
  }, []);
  useEffect(() => {
    const onKey = (e) => {
      if (isTyping(e.target)) return;
      const mod = e.metaKey || e.ctrlKey;
      if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); }
      else if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [undo, redo]);

  const startNew = (kind, name) => {
    const p = kind === 'sans' ? Core.sansProject(name) : Core.blankProject(name);
    Persist.flush();
    draftRef.current = false; setIsDraft(false);
    savedRef.current = p; projectRef.current = p; setProject(p);
    Persist.saveAll(p);
    resetHistory(); setGlyphId(null); setView('glyphs'); setDrawer(false);
    toast(`Started ${name}`);
  };
  const importFile = async (file) => {
    try {
      const p = Core.importProjectJSON(await file.text());
      Persist.flush();
      draftRef.current = false; setIsDraft(false);
      savedRef.current = p; projectRef.current = p; setProject(p);
      Persist.saveAll(p);
      resetHistory(); setGlyphId(null); setView('glyphs'); setDrawer(false);
      toast(`Imported ${p.info.familyName}`);
    } catch (e) { toast(e.message || 'That file didn’t import.'); }
  };
  const deleteProject = async (id) => {
    try { await Persist.remove(id); } catch { toast('Couldn’t delete that typeface.'); return; }
    const rest = projects.filter((p) => p.id !== id);
    setProjects(rest);
    if (id === projectRef.current.id) {
      if (rest.length) openProject(rest[0].id);
      else {
        const p = Core.sansProject('Studio Sans');
        draftRef.current = true; setIsDraft(true); draftBase.current = p;
        savedRef.current = null; projectRef.current = p; setProject(p); resetHistory();
      }
    }
    toast('Deleted');
  };

  const openGlyph = useCallback((id) => { setGlyphId(id); setView('edit'); }, []);
  const createGlyph = useCallback((cp) => {
    const p = projectRef.current;
    const g = Core.newGlyphFor(cp, Core.categoryOfCodepoint(cp) === 'lower' ? 520 : 600);
    if (Object.values(p.glyphs).some((x) => x.name === g.name)) g.name = g.name + '.' + Core.uid(3);
    commit({ ...p, glyphs: { ...p.glyphs, [g.id]: g }, glyphOrder: [...p.glyphOrder, g.id] });
    openGlyph(g.id);
  }, [commit, openGlyph]);
  const order = project.glyphOrder.filter((id) => project.glyphs[id] && project.glyphs[id].name !== '.notdef');
  const editId = glyphId && project.glyphs[glyphId] ? glyphId
    : (order.find((id) => project.glyphs[id].name === 'A') || order[0]);
  const nav = useCallback((d) => {
    setGlyphId((cur) => {
      const p = projectRef.current;
      const ord = p.glyphOrder.filter((id) => p.glyphs[id] && p.glyphs[id].name !== '.notdef');
      const i = Math.max(0, ord.indexOf(cur && p.glyphs[cur] ? cur : editId));
      return ord[(i + d + ord.length) % ord.length];
    });
  }, [editId]);

  const saveLabel = persist.mode === 'pending' ? 'Connecting'
    : isDraft ? 'Example'
    : persist.mode === 'memory' ? 'Not saved'
    : persist.state === 'saving' ? 'Saving' : persist.state === 'error' ? 'Not saved' : persist.mode === 'local' ? 'Saved locally' : 'Saved';
  const dotCls = isDraft || persist.mode === 'pending' ? '' : persist.state === 'saving' ? 'saving' : persist.state === 'error' || persist.mode === 'memory' ? 'error' : 'saved';
  const banner = persist.message ? { text: persist.message, error: persist.state === 'error' }
    : isDraft && persist.mode !== 'pending' ? { text: 'This is an example typeface. Your first edit saves it as yours. To start fresh, click its name at the top left.' }
    : null;

  return html`<div class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark"><${Icon} name="pen" size=${14} sw=${2} /></span><span class="brand-text">Typeface Studio</span></div>
      <span class="sep"></span>
      <button class="project-btn" onClick=${() => { refreshList(); setDrawer(true); }} aria-haspopup="dialog" title="Your typefaces">
        <span class="name uf" style=${{ fontFamily: fontStack(font) }}>${project.info.familyName || 'Untitled'}</span><${Icon} name="down" size=${15} />
      </button>
      <nav class="tabs" aria-label="Sections">
        ${TABS.map(([k, label]) => html`<button key=${k} class="tab" aria-current=${view === k ? 'page' : undefined} onClick=${() => setView(k)}>${label}</button>`)}
      </nav>
      <span class="spacer"></span>
      <button class="btn btn-ghost icon-btn" aria-label="Undo" title="Undo (⌘Z)" disabled=${!hist.current.past.length} onClick=${undo}><${Icon} name="undo" /></button>
      <button class="btn btn-ghost icon-btn" aria-label="Redo" title="Redo (⇧⌘Z)" disabled=${!hist.current.future.length} onClick=${redo}><${Icon} name="redo" /></button>
      <span class="save-state" title=${persist.mode === 'db' ? 'Saved privately to your Claude account' : persist.mode === 'local' ? 'Saved in this browser' : ''}><span class=${cls('save-dot', dotCls)}></span><span class="txt">${saveLabel}</span></span>
    </header>
    ${banner ? html`<div class=${cls('banner', banner.error && 'error')} role="status">${banner.text}</div>` : html`<div></div>`}
    <main class="main" style=${view === 'edit' ? { overflow: 'hidden' } : null}>
      ${view === 'glyphs' && html`<${GlyphsView} project=${project} font=${font} onOpen=${openGlyph} onCreate=${createGlyph} api=${api} />`}
      ${view === 'edit' && html`<${EditorView} project=${project} glyphId=${editId} api=${api} onNav=${nav} onPick=${setGlyphId} announce=${announce} />`}
      ${view === 'spacing' && html`<${SpacingView} project=${project} api=${api} font=${font} />`}
      ${view === 'test' && html`<${TestView} project=${project} font=${font} />`}
      ${view === 'export' && html`<${ExportView} project=${project} api=${api} font=${font} downloads=${downloads} toast=${toast} persistMode=${persist.mode} />`}
    </main>
    <nav class="tabbar" aria-label="Sections">
      ${TABS.map(([k, label, icon]) => html`<button key=${k} aria-current=${view === k ? 'page' : undefined} onClick=${() => setView(k)}><${Icon} name=${icon} size=${20} />${label}</button>`)}
    </nav>
    <${ProjectsDialog} open=${drawer} onClose=${() => setDrawer(false)} projects=${projects} current=${project} isDraft=${isDraft}
      persist=${persist} onOpen=${openProject} onNew=${startNew} onImport=${importFile} onDelete=${deleteProject} />
    ${toastMsg && html`<div class="toast" role="status">${toastMsg}</div>`}
    <div class="sr-only" aria-live="polite">${live}</div>
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
/*@app-end*/
}
</script>
