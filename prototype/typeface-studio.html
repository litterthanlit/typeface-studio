<title>Typeface Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: an instrument, not a page. A slim top bar over a full-bleed workspace;
   overview pages get an editorial header set in the user's own typeface. */
:root {
  --bg: #f3f4f6;
  --surface: #ffffff;
  --surface-2: #eceef2;
  --ink: #13151a;
  --muted: #59606c;
  --faint: #8a909b;
  --line: #e1e4e9;
  --line-strong: #c8ccd4;
  --accent: #2a46ff;
  --accent-ink: #ffffff;
  --accent-soft: rgba(42, 70, 255, 0.1);
  --danger: #c0352b;
  --ok: #17784c;
  --warn: #946200;
  --canvas: #fafafb;
  --glyph-tint: rgba(19, 21, 26, 0.075);
  --metric: #dcdfe5;
  --metric-label: #979da8;
  --glass: rgba(255, 255, 255, 0.72);
  --shadow-sm: 0 1px 2px rgba(15, 18, 26, 0.06);
  --shadow: 0 1px 2px rgba(15, 18, 26, 0.05), 0 12px 32px -12px rgba(15, 18, 26, 0.2);
  --f-ui: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c0d10; --surface: #15171c; --surface-2: #1c1f26; --ink: #eceef2; --muted: #a3a9b4; --faint: #6d737e;
    --line: #262a32; --line-strong: #383d47; --accent: #7f8fff; --accent-ink: #0c0d10; --accent-soft: rgba(127, 143, 255, 0.15);
    --danger: #ff7d73; --ok: #4cc38a; --warn: #e2b340; --canvas: #101216; --glyph-tint: rgba(236, 238, 242, 0.085);
    --metric: #2a2e37; --metric-label: #5e646f; --glass: rgba(21, 23, 28, 0.72);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4); --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 16px 40px -12px rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c0d10; --surface: #15171c; --surface-2: #1c1f26; --ink: #eceef2; --muted: #a3a9b4; --faint: #6d737e;
  --line: #262a32; --line-strong: #383d47; --accent: #7f8fff; --accent-ink: #0c0d10; --accent-soft: rgba(127, 143, 255, 0.15);
  --danger: #ff7d73; --ok: #4cc38a; --warn: #e2b340; --canvas: #101216; --glyph-tint: rgba(236, 238, 242, 0.085);
  --metric: #2a2e37; --metric-label: #5e646f; --glass: rgba(21, 23, 28, 0.72);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4); --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 16px 40px -12px rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--f-ui); -webkit-font-smoothing: antialiased; }
*, *::before, *::after { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
.mono { font-family: var(--f-mono); }
.tnum { font-variant-numeric: tabular-nums; }
.uf { font-weight: 400; font-synthesis: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#root { height: 100%; }
.app { height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; }

/* ---------- top bar ---------- */
.topbar {
  display: flex; align-items: center; gap: 12px; height: 56px;
  padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 13px; letter-spacing: -0.01em; white-space: nowrap; }
.brand-mark { width: 24px; height: 24px; border-radius: 7px; background: var(--ink); color: var(--bg); display: grid; place-items: center; }
.brand-text { color: var(--muted); font-weight: 500; }
.project-btn {
  display: flex; align-items: center; gap: 8px; min-width: 0; max-width: 260px; height: 34px; padding: 0 10px;
  border: 1px solid transparent; border-radius: 8px; background: transparent; transition: background 0.15s, border-color 0.15s;
}
.project-btn:hover { background: var(--surface-2); }
.project-btn .name { font-size: 17px; line-height: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.project-btn svg { flex: none; color: var(--faint); }
.sep { width: 1px; height: 20px; background: var(--line); flex: none; }
.tabs { display: flex; gap: 2px; padding: 3px; background: var(--surface-2); border-radius: 10px; }
.tab {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border: 0; border-radius: 7px;
  background: transparent; color: var(--muted); font-weight: 500; font-size: 13px; transition: background 0.15s, color 0.15s;
}
.tab:hover { color: var(--ink); }
.tab[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
.spacer { flex: 1; }
.save-state { display: flex; align-items: center; gap: 8px; font: 12px var(--f-mono); color: var(--faint); white-space: nowrap; }
.save-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.save-dot.saved { background: var(--ok); }
.save-dot.saving { background: var(--accent); animation: pulse 1s var(--ease) infinite; }
.save-dot.error { background: var(--danger); }
@keyframes pulse { 50% { opacity: 0.35; } }
.banner {
  display: flex; align-items: center; gap: 10px; padding: 8px var(--gutter-r) 8px var(--gutter-l);
  background: var(--accent-soft); color: var(--ink); font-size: 13px; border-bottom: 1px solid var(--line);
}
.banner.error { background: color-mix(in srgb, var(--danger) 12%, transparent); }
.tabbar { display: none; }

/* ---------- controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 34px; padding: 0 14px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink);
  font-weight: 500; font-size: 13px; white-space: nowrap;
  transition: background 0.15s, border-color 0.15s, transform 0.1s, opacity 0.15s;
}
.btn:hover { border-color: var(--line-strong); background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
.btn-accent { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-accent:hover { background: color-mix(in srgb, var(--accent) 88%, var(--ink)); border-color: transparent; }
.btn-ghost { border-color: transparent; background: transparent; }
.btn-ghost:hover { background: var(--surface-2); border-color: transparent; }
.btn-danger { color: var(--danger); }
.icon-btn { width: 34px; padding: 0; }
.btn-sm { height: 28px; padding: 0 10px; font-size: 12px; }
.icon-btn.btn-sm { width: 28px; padding: 0; }
.input {
  width: 100%; min-width: 0; height: 34px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface); color: var(--ink); font-size: 14px; font-variant-numeric: tabular-nums;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.input:hover { border-color: var(--line-strong); }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input.mono { font-family: var(--f-mono); font-size: 13px; }
.input[aria-invalid="true"] { border-color: var(--danger); }
select.input { padding-right: 6px; }
textarea.input { height: auto; padding: 10px; resize: vertical; }
.field { display: grid; gap: 6px; min-width: 0; }
.label { font: 500 11px/1 var(--f-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); }
.hint { font-size: 12px; color: var(--muted); }
.err { font-size: 12px; color: var(--danger); }
.row { display: flex; gap: 8px; align-items: center; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-weight: 500; font-size: 13px;
  white-space: nowrap; transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.chip:hover { color: var(--ink); border-color: var(--line-strong); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip .count { font: 11px var(--f-mono); opacity: 0.7; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--surface-2); border-radius: 9px; }
.seg button { height: 28px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-weight: 500; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
.kbd { display: inline-block; min-width: 20px; padding: 1px 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; background: var(--surface); color: var(--muted); font: 500 11px/1.4 var(--f-mono); text-align: center; }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); cursor: pointer; }
.switch input { appearance: none; width: 30px; height: 18px; border-radius: 999px; background: var(--line-strong); position: relative; margin: 0; cursor: pointer; transition: background 0.15s; }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow-sm); transition: transform 0.18s var(--ease); }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { transform: translateX(12px); }
input[type="range"] { width: 100%; accent-color: var(--accent); }

/* ---------- pages ---------- */
.main { min-height: 0; overflow: auto; }
.page { max-width: 1240px; margin: 0 auto; padding: 36px var(--gutter-r) 56px var(--gutter-l); display: grid; gap: 28px; }
.eyebrow { font: 500 11px/1 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); }
.hero { display: grid; gap: 14px; }
.hero-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
.display { font-size: clamp(44px, 7vw, 88px); line-height: 0.95; letter-spacing: -0.01em; font-weight: 600; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 18px; font: 12px var(--f-mono); color: var(--muted); }
.meta b { color: var(--ink); font-weight: 500; }
.h2 { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.toolbar-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

/* glyph grid */
.ggrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.tile {
  position: relative; display: flex; flex-direction: column; aspect-ratio: 1 / 1.18; padding: 0; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; color: var(--ink);
  transition: transform 0.18s var(--ease), border-color 0.15s, box-shadow 0.18s var(--ease);
}
.tile:hover { transform: translateY(-2px); border-color: var(--line-strong); box-shadow: var(--shadow); }
.tile svg { flex: 1; min-height: 0; width: 100%; }
.tile .tile-foot { display: flex; justify-content: space-between; gap: 6px; padding: 6px 9px 7px; border-top: 1px solid var(--line); font: 11px var(--f-mono); color: var(--faint); }
.tile .tile-foot span:first-child { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile.empty, .tile.missing { background: transparent; border-style: dashed; }
.tile.missing { color: var(--faint); }
.tile .ghost { position: absolute; inset: 0 0 30px; display: grid; place-items: center; font-size: 44px; color: var(--line-strong); }
.tile.missing:hover .ghost::after { content: "+"; position: absolute; right: 10px; top: 6px; font: 500 16px var(--f-mono); color: var(--accent); }
.baseline-line { stroke: var(--metric); stroke-width: 1; vector-effect: non-scaling-stroke; }

/* ---------- editor ---------- */
.editor { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 300px; grid-template-rows: minmax(0, 1fr) auto; }
.canvas-wrap { position: relative; min-height: 0; overflow: hidden; background: var(--canvas); }
.canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; display: block; }
.glass { background: var(--glass); -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4); border: 1px solid var(--line); box-shadow: var(--shadow); }
.toolrail { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 4px; padding: 6px; border-radius: 13px; z-index: 2; }
.tool { width: 38px; height: 38px; display: grid; place-items: center; border: 0; border-radius: 9px; background: transparent; color: var(--muted); transition: background 0.15s, color 0.15s; }
.tool:hover { background: var(--surface-2); color: var(--ink); }
.tool[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.toolrail .rule { height: 1px; margin: 3px 6px; background: var(--line); }
.glyph-head { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 12px; z-index: 2; max-width: calc(100% - 32px); }
.glyph-head .gname { display: flex; align-items: baseline; gap: 10px; padding: 0 10px; white-space: nowrap; }
.glyph-head .gname b { font-weight: 600; font-size: 14px; }
.glyph-head .gname span { font: 11px var(--f-mono); color: var(--faint); }
.zoom-pill { position: absolute; right: 14px; bottom: 14px; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 11px; z-index: 2; }
.zoom-pill output { min-width: 52px; text-align: center; font: 12px var(--f-mono); color: var(--muted); }
.sheet-btn { display: none; }
.inspector { grid-column: 2; grid-row: 1 / span 2; min-height: 0; overflow: auto; background: var(--surface); border-left: 1px solid var(--line); padding: 20px; display: flex; flex-direction: column; gap: 26px; }
.insp-sec { display: grid; gap: 12px; }
.insp-sec > header { display: flex; align-items: center; justify-content: space-between; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.actions .btn { justify-content: flex-start; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 7px 12px; font-size: 12px; color: var(--muted); align-items: center; margin: 0; }
.keys dt { white-space: nowrap; }
.keys dd { margin: 0; }
.strip { grid-column: 1; display: flex; align-items: center; gap: 14px; min-width: 0; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--line); }
.strip .input { width: 150px; flex: none; }
.run-scroll { flex: 1; min-width: 0; overflow-x: auto; overflow-y: hidden; }
.run-scroll svg { display: block; }
.run-glyph { fill: var(--ink); cursor: pointer; transition: fill 0.15s; }
.run-glyph:hover { fill: var(--muted); }
.run-glyph.hl { fill: var(--accent); }
.run-missing { fill: none; stroke: var(--line-strong); stroke-dasharray: 20 16; }

/* canvas drawing */
.c-metric { stroke: var(--metric); stroke-width: 1; shape-rendering: crispEdges; }
.c-metric.base { stroke: var(--line-strong); }
.c-label { font: 10px var(--f-mono); fill: var(--metric-label); letter-spacing: 0.04em; }
.c-label.sb { fill: var(--faint); }
.c-fill { fill: var(--glyph-tint); }
.c-fill.solid { fill: var(--ink); }
.c-stroke { fill: none; stroke: var(--ink); stroke-width: 1.25; vector-effect: non-scaling-stroke; }
.c-seg { fill: none; stroke: transparent; stroke-width: 12; vector-effect: non-scaling-stroke; pointer-events: stroke; }
.c-seg:hover { stroke: var(--accent-soft); }
.c-handle-line { stroke: var(--accent); stroke-width: 1; opacity: 0.65; }
.c-handle { fill: var(--surface); stroke: var(--accent); stroke-width: 1.25; }
.c-node { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
.c-node.sel { fill: var(--accent); stroke: var(--accent); }
.c-node.start { stroke: var(--accent); }
.c-hit { fill: transparent; }
.c-adv { stroke: var(--line-strong); stroke-width: 1; stroke-dasharray: 4 4; }
.c-adv-hit { stroke: transparent; stroke-width: 14; cursor: ew-resize; }
.c-adv-hit:hover + .c-adv, .c-adv.active { stroke: var(--accent); stroke-dasharray: none; }
.c-pen { fill: none; stroke: var(--accent); stroke-width: 1.25; stroke-dasharray: 5 4; }
.c-close { fill: none; stroke: var(--accent); stroke-width: 1.5; }
.c-marquee { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1; }
.c-arrow { fill: var(--accent); }

/* ---------- spacing ---------- */
.split { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 20px; align-items: start; }
.pairs { display: grid; gap: 12px; padding: 16px; }
.pair-list { display: grid; max-height: 460px; overflow: auto; margin: 0 -6px; }
.pair-row { display: grid; grid-template-columns: 1fr 86px 28px; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 8px; }
.pair-row:hover { background: var(--surface-2); }
.pair-row[aria-selected="true"] { background: var(--accent-soft); }
.pair-row .pair-name { border: 0; background: transparent; text-align: left; padding: 4px 2px; font: 13px var(--f-mono); color: var(--ink); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pair-row .input { height: 28px; font-size: 12px; }
.preview-card { display: grid; gap: 16px; padding: 20px; min-width: 0; }
.kern-stage { position: relative; border-radius: 10px; background: var(--canvas); border: 1px solid var(--line); overflow: hidden; touch-action: none; }
.kern-stage svg { display: block; width: 100%; height: 260px; }
.kern-stage .drag-glyph { cursor: ew-resize; }
.kern-value { font: 500 40px/1 var(--f-mono); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.proof { font-size: 44px; line-height: 1.15; overflow-wrap: anywhere; font-kerning: normal; }
.empty-note { padding: 18px; border: 1px dashed var(--line-strong); border-radius: 10px; color: var(--muted); font-size: 13px; }
.sp-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.sp-table th { text-align: left; padding: 8px; font: 500 11px var(--f-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); }
.sp-table td { padding: 6px 8px; border-bottom: 1px solid var(--line); }
.sp-table .input { height: 28px; width: 86px; font-size: 12px; }
.sp-glyph { display: flex; align-items: center; gap: 10px; }
.sp-glyph svg { width: 34px; height: 34px; background: var(--canvas); border-radius: 6px; }

/* ---------- tester ---------- */
.tester-controls { display: flex; flex-wrap: wrap; gap: 18px 24px; align-items: flex-end; padding: 16px 18px; }
.tester-controls .field { width: 180px; }
.specimen {
  width: 100%; min-height: 240px; border: 0; padding: 4px 0; background: transparent; color: var(--ink); resize: vertical;
  outline: none; font-kerning: normal; overflow-wrap: anywhere;
}
.specimen:focus-visible { outline: none; box-shadow: inset 0 -2px 0 var(--accent); }
.waterfall { display: grid; gap: 4px; }
.wf-row { display: grid; grid-template-columns: 48px minmax(0, 1fr); align-items: baseline; gap: 14px; padding: 6px 0; border-top: 1px solid var(--line); }
.wf-row span { font: 11px var(--f-mono); color: var(--faint); }
.wf-row div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-kerning: normal; }
.status-pill { display: inline-flex; align-items: center; gap: 8px; height: 26px; padding: 0 10px; border-radius: 999px; background: var(--surface-2); font: 12px var(--f-mono); color: var(--muted); }

/* ---------- export ---------- */
.export-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.form-card { display: grid; gap: 22px; padding: 22px; }
.export-card { display: grid; gap: 18px; padding: 22px; position: sticky; top: 20px; }
.file-name { font: 500 15px var(--f-mono); overflow-wrap: anywhere; }
.diag { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.diag li { display: grid; grid-template-columns: 8px 1fr; gap: 10px; align-items: baseline; font-size: 13px; color: var(--muted); }
.diag li::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); transform: translateY(-1px); }
.diag li.info::before { background: var(--faint); }
.diag li.ok::before { background: var(--ok); }
details.install summary { cursor: pointer; font-weight: 500; }
details.install ol { margin: 10px 0 0; padding-left: 18px; color: var(--muted); font-size: 13px; display: grid; gap: 6px; }
.metrics-diagram { width: 100%; height: auto; display: block; }

/* ---------- projects dialog ---------- */
dialog.drawer {
  width: min(560px, calc(100vw - 32px)); max-height: min(720px, calc(100% - 32px)); padding: 0; border: 1px solid var(--line);
  border-radius: 16px; background: var(--surface); color: var(--ink); box-shadow: var(--shadow);
}
dialog.drawer::backdrop { background: rgba(10, 12, 16, 0.35); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
dialog.drawer[open] { animation: rise 0.22s var(--ease); }
@keyframes rise { from { opacity: 0; transform: translateY(8px) scale(0.99); } }
.drawer-body { display: grid; gap: 22px; padding: 22px; }
.drawer-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.proj-list { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }
.proj-item { display: flex; align-items: center; gap: 8px; padding: 6px; border-radius: 10px; }
.proj-item:hover { background: var(--surface-2); }
.proj-item[aria-current="true"] { background: var(--accent-soft); }
.proj-open { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; border: 0; background: transparent; text-align: left; padding: 4px 6px; }
.proj-open b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.proj-open span { font: 11px var(--f-mono); color: var(--faint); }
.starts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.start-card { display: grid; gap: 8px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); text-align: left; transition: border-color 0.15s, transform 0.18s var(--ease), box-shadow 0.18s var(--ease); }
.start-card:hover { border-color: var(--line-strong); transform: translateY(-2px); box-shadow: var(--shadow); }
.start-card svg { height: 58px; width: 100%; }
.start-card b { font-weight: 600; }
.start-card span { font-size: 12px; color: var(--muted); }

/* toast */
.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  max-width: calc(100vw - 32px); padding: 10px 16px; border-radius: 10px; background: var(--ink); color: var(--bg);
  font-size: 13px; box-shadow: var(--shadow); z-index: 50; animation: rise 0.2s var(--ease);
}

/* ---------- responsive ---------- */
@media (max-width: 900px) {
  .split, .export-grid { grid-template-columns: minmax(0, 1fr); }
  .export-card { position: static; }
  .editor { grid-template-columns: minmax(0, 1fr); }
  .inspector { display: none; }
  .inspector.open {
    display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; max-height: 62%;
    border: 1px solid var(--line); border-radius: 16px 16px 0 0; box-shadow: var(--shadow);
    padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  }
  .sheet-btn { display: inline-flex; position: absolute; left: 14px; bottom: 14px; z-index: 2; }
}
@media (max-width: 720px) {
  .topbar { gap: 8px; }
  .topbar .tabs, .brand-text, .topbar .sep, .save-state .txt { display: none; }
  .tabbar {
    display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line);
    padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  }
  .tabbar button { display: grid; justify-items: center; gap: 3px; padding: 8px 0 9px; border: 0; background: transparent; color: var(--faint); font-size: 11px; font-weight: 500; }
  .tabbar button[aria-current="page"] { color: var(--ink); }
  .page { padding-top: 24px; gap: 22px; }
  .toolrail { top: auto; bottom: 14px; transform: none; flex-direction: row; padding: 4px; gap: 2px; }
  .toolrail .rule { width: 1px; height: auto; margin: 6px 3px; }
  .tool { width: 36px; height: 36px; }
  .sheet-btn { top: 12px; bottom: auto; }
  .glyph-head { left: auto; right: 14px; transform: none; }
  .strip .input { width: 110px; }
  .starts { grid-template-columns: 1fr; }
  .tester-controls .field { width: 100%; }
  .ggrid { grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

// ---------- persistence: claude.ai db (private per viewer) → localStorage → memory ----------
const Persist = (() => {
  const LS_INDEX = 'typeface-studio:index';
  const lsKey = (id) => 'typeface-studio:project:' + id;
  let mode = 'pending', db = null, userId = null, state = 'idle', message = null;
  const subs = new Set();
  const notify = () => subs.forEach((f) => f({ mode, state, message }));
  const setState = (s, msg = null) => { state = s; message = msg; notify(); };
  const lsGet = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch { return false; } };
  const lsDel = (k) => { try { localStorage.removeItem(k); } catch {} };
  const lsOK = () => lsSet('typeface-studio:probe', '1') && (lsDel('typeface-studio:probe'), true);

  async function init() {
    try {
      if (window.claude && typeof window.claude.use === 'function') {
        const [d, u] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
        const id = u ? await u.id() : null;
        if (d && id) { db = d; userId = id; mode = 'db'; }
      }
    } catch {}
    if (mode !== 'db') mode = lsOK() ? 'local' : 'memory';
    notify();
    return mode;
  }
  const projCol = () => db.collection('data/users/' + userId);
  const projDoc = (pid) => projCol().doc(pid);
  const glyphDoc = (pid, gid) => projDoc(pid).collection('glyphs').doc(gid);

  // Debounced, coalescing write queue: one write in flight per document, at most 4 overall.
  const pending = new Map(), timers = new Map(), active = new Set(), ready = [], retried = new Set();
  function schedule(key, fn, delay = 600) {
    pending.set(key, fn);
    clearTimeout(timers.get(key));
    timers.set(key, setTimeout(() => { timers.delete(key); enqueue(key); }, delay));
    if (state !== 'saving') setState('saving');
  }
  function enqueue(key) { if (!ready.includes(key)) ready.push(key); pump(); }
  function pump() {
    let i = 0;
    while (i < ready.length && active.size < 4) {
      const key = ready[i];
      if (active.has(key)) { i++; continue; }
      ready.splice(i, 1);
      const fn = pending.get(key);
      pending.delete(key);
      if (!fn) continue;
      active.add(key);
      Promise.resolve().then(fn).then(() => retried.delete(key), (e) => onError(e, key, fn)).finally(() => {
        active.delete(key);
        if (pending.has(key) && !timers.has(key)) ready.push(key);
        pump();
        settle();
      });
    }
  }
  function settle() {
    if (!active.size && !ready.length && !timers.size && !pending.size && state === 'saving') setState('saved');
  }
  let fallbackHook = null;
  function onError(e, key, fn) {
    const code = e && e.code;
    if ((code === 'unavailable' || code === 'resource_exhausted') && !retried.has(key)) {
      retried.add(key);
      schedule(key, fn, 1500 + Math.random() * 1500);
      return;
    }
    retried.delete(key);
    if (mode === 'db' && ['invalid_argument', 'not_granted', 'revoked', 'capability_disabled', 'capability_removed'].includes(code)) {
      mode = lsOK() ? 'local' : 'memory';
      pending.clear(); timers.forEach(clearTimeout); timers.clear(); ready.length = 0;
      setState('saving', 'Saving to your Claude account isn’t available in this view, so work is kept in this browser.');
      if (fallbackHook) fallbackHook();
      return;
    }
    if (code === 'local_full') setState('error', 'This browser’s storage is full. Save the project file from Export to keep your work.');
    else if (code === 'quota_exceeded') setState('error', 'Your saved space is full. Delete an old typeface to keep saving.');
    else setState('error', 'The last change didn’t save. It will try again with your next edit.');
  }
  function flush() { for (const [k, t] of timers) { clearTimeout(t); timers.delete(k); enqueue(k); } }

  const localIndex = () => { try { return JSON.parse(lsGet(LS_INDEX) || '[]'); } catch { return []; } };
  const summaryOf = (p) => ({ id: p.id, familyName: p.info.familyName, glyphCount: p.glyphOrder.length, updatedAt: new Date().toISOString() });
  const metaOf = (p) => ({ kind: 'project', schemaVersion: 1, info: p.info, glyphOrder: p.glyphOrder, kerning: p.kerning, createdAt: p.createdAt, updatedAt: new Date().toISOString(), glyphCount: p.glyphOrder.length });
  function saveLocal(p) {
    schedule('local:' + p.id, async () => {
      if (!lsSet(lsKey(p.id), JSON.stringify(p))) throw { code: 'local_full' };
      const idx = localIndex().filter((s) => s.id !== p.id);
      idx.unshift(summaryOf(p));
      lsSet(LS_INDEX, JSON.stringify(idx));
    }, 500);
  }
  function saveAll(p) {
    if (mode === 'db') {
      schedule('m:' + p.id, () => projDoc(p.id).set(metaOf(p)), 0);
      for (const id of p.glyphOrder) { const g = p.glyphs[id]; schedule('g:' + p.id + ':' + id, () => glyphDoc(p.id, id).set(g), 0); }
    } else if (mode === 'local') saveLocal(p);
  }
  function saveDiff(prev, next) {
    if (!prev || prev.id !== next.id) return saveAll(next);
    if (mode === 'local') return saveLocal(next);
    if (mode !== 'db') return;
    let changed = false;
    for (const id of next.glyphOrder) {
      const g = next.glyphs[id];
      if (prev.glyphs[id] !== g) { changed = true; schedule('g:' + next.id + ':' + id, () => glyphDoc(next.id, id).set(g)); }
    }
    for (const id of Object.keys(prev.glyphs)) {
      if (!next.glyphs[id]) { changed = true; schedule('g:' + next.id + ':' + id, () => glyphDoc(next.id, id).delete()); }
    }
    if (changed || prev.info !== next.info || prev.glyphOrder !== next.glyphOrder || prev.kerning !== next.kerning) {
      schedule('m:' + next.id, () => projDoc(next.id).set(metaOf(next)));
    }
  }
  async function list() {
    if (mode === 'db') {
      const snap = await projCol().limit(200).get();
      return snap.docs.map((d) => ({ id: d.id, ...d.data() })).filter((d) => d.kind === 'project')
        .map((d) => ({ id: d.id, familyName: (d.info && d.info.familyName) || 'Untitled', glyphCount: d.glyphCount || (d.glyphOrder || []).length, updatedAt: d.updatedAt || '' }))
        .sort((a, b) => (a.updatedAt < b.updatedAt ? 1 : -1));
    }
    if (mode === 'local') return localIndex();
    return [];
  }
  async function load(id) {
    if (mode === 'db') {
      const [m, gs] = await Promise.all([projDoc(id).get(), projDoc(id).collection('glyphs').limit(1000).get()]);
      if (!m.exists) throw new Error('That typeface no longer exists.');
      const meta = m.data();
      const glyphs = {};
      gs.docs.forEach((d) => { glyphs[d.id] = d.data(); });
      const order = (meta.glyphOrder || []).filter((g) => glyphs[g]);
      for (const g of Object.keys(glyphs)) if (!order.includes(g)) order.push(g);
      return Core.validateProject({ id, info: meta.info, glyphs, glyphOrder: order, kerning: meta.kerning || {}, createdAt: meta.createdAt, updatedAt: meta.updatedAt });
    }
    if (mode === 'local') {
      const raw = lsGet(lsKey(id));
      if (!raw) throw new Error('That typeface no longer exists.');
      return Core.validateProject(JSON.parse(raw));
    }
    throw new Error('Nothing is saved yet.');
  }
  async function remove(id) {
    if (mode === 'db') {
      const gs = await projDoc(id).collection('glyphs').limit(1000).get();
      await projDoc(id).delete();
      for (const d of gs.docs) schedule('g:' + id + ':' + d.id, () => glyphDoc(id, d.id).delete(), 0);
    } else if (mode === 'local') {
      lsDel(lsKey(id));
      lsSet(LS_INDEX, JSON.stringify(localIndex().filter((s) => s.id !== id)));
    }
  }
  return {
    init, list, load, remove, saveAll, saveDiff, flush,
    subscribe(f) { subs.add(f); f({ mode, state, message }); return () => subs.delete(f); },
    setFallbackHook(f) { fallbackHook = f; },
    get mode() { return mode; },
  };
})();

// ---------- hooks ----------
function useSize(ref) {
  const [s, set] = useState({ w: 0, h: 0 });
  useLayoutEffect(() => {
    const el = ref.current;
    if (!el) return;
    const ro = new ResizeObserver(([e]) => set({ w: Math.round(e.contentRect.width), h: Math.round(e.contentRect.height) }));
    ro.observe(el);
    return () => ro.disconnect();
  }, []);
  return s;
}

/** Compile the project to TrueType and register it as a FontFace (debounced, latest wins). */
function useCompiledFont(project) {
  const [st, setSt] = useState({ status: 'compiling', family: null, stats: null, diagnostics: [], error: null, fileName: '' });
  const seq = useRef(0), face = useRef(null), timer = useRef(null), firstAt = useRef(0);
  useEffect(() => {
    const now = performance.now();
    if (!firstAt.current) firstAt.current = now;
    clearTimeout(timer.current);
    const wait = Math.max(0, Math.min(320, 1100 - (now - firstAt.current)));
    timer.current = setTimeout(async () => {
      firstAt.current = 0;
      const my = ++seq.current;
      let res;
      try { res = Core.compileFont(project); }
      catch (e) { setSt((s) => ({ ...s, status: 'error', error: e.message || String(e) })); return; }
      const family = 'TSF' + my + '_' + project.id.slice(0, 6);
      let ff;
      try {
        ff = new FontFace(family, res.bytes.buffer.slice(0));
        await ff.load();
      } catch (e) {
        if (my === seq.current) setSt((s) => ({ ...s, status: 'error', error: 'The browser couldn’t load this font build.' }));
        return;
      }
      if (my !== seq.current) return;
      document.fonts.add(ff);
      const prev = face.current;
      face.current = ff;
      setSt({ status: 'ready', family, stats: res.stats, diagnostics: res.diagnostics, error: null, fileName: res.fileName });
      if (prev) requestAnimationFrame(() => requestAnimationFrame(() => document.fonts.delete(prev)));
    }, wait);
    return () => clearTimeout(timer.current);
  }, [project]);
  useEffect(() => () => { if (face.current) document.fonts.delete(face.current); }, []);
  return st;
}
const fontStack = (font) => (font && font.family ? `"${font.family}", var(--f-ui)` : 'var(--f-ui)');

// ---------- shared pieces ----------
function NumField({ value, onCommit, step = 1, disabled, label, id, min, max, mono = true }) {
  const [txt, setTxt] = useState(value == null ? '' : String(value));
  const focused = useRef(false);
  useEffect(() => { if (!focused.current) setTxt(value == null ? '' : String(value)); }, [value]);
  const clamp = (v) => Math.max(min ?? -Infinity, Math.min(max ?? Infinity, v));
  const commit = (t) => {
    const v = Number(t);
    if (t.trim() === '' || !Number.isFinite(v)) { setTxt(value == null ? '' : String(value)); return; }
    const c = clamp(Math.round(v));
    setTxt(String(c));
    if (c !== value) onCommit(c);
  };
  return html`<input id=${id} class=${cls('input', mono && 'mono')} inputmode="numeric" aria-label=${label} disabled=${disabled}
    value=${txt} onChange=${(e) => setTxt(e.target.value)}
    onFocus=${(e) => { focused.current = true; e.target.select(); }}
    onBlur=${(e) => { focused.current = false; commit(e.target.value); }}
    onKeyDown=${(e) => {
      if (e.key === 'Enter') { commit(e.target.value); e.target.blur(); }
      else if (e.key === 'Escape') { setTxt(value == null ? '' : String(value)); e.target.blur(); }
      else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        e.preventDefault();
        const v = clamp((Number(txt) || 0) + (e.key === 'ArrowUp' ? 1 : -1) * (e.shiftKey ? 10 : step));
        setTxt(String(v)); onCommit(v);
      }
    }} />`;
}
function TextField({ value, onCommit, label, id, validate, mono, placeholder }) {
  const [txt, setTxt] = useState(value);
  const [err, setErr] = useState(null);
  const focused = useRef(false);
  useEffect(() => { if (!focused.current) { setTxt(value); setErr(null); } }, [value]);
  const commit = () => {
    if (txt === value) { setErr(null); return; }
    const e = validate ? validate(txt) : null;
    if (e) { setErr(e); return; }
    setErr(null);
    onCommit(txt);
  };
  return html`<div class="field">
    <label class="label" for=${id}>${label}</label>
    <input id=${id} class=${cls('input', mono && 'mono')} value=${txt} placeholder=${placeholder} aria-invalid=${err ? 'true' : 'false'}
      aria-describedby=${err ? id + '-err' : undefined}
      onChange=${(e) => setTxt(e.target.value)} onFocus=${() => { focused.current = true; }}
      onBlur=${() => { focused.current = false; commit(); }}
      onKeyDown=${(e) => { if (e.key === 'Enter') e.target.blur(); if (e.key === 'Escape') { setTxt(value); setErr(null); } }} />
    ${err && html`<span class="err" id=${id + '-err'}>${err}</span>`}
  </div>`;
}

/** One glyph drawn from the model on a fixed em box (shared scale across tiles). */
const GlyphSvg = memo(function GlyphSvg({ glyph, info, pad = 60, baseline = true, className }) {
  const asc = info.ascender + pad, desc = info.descender - pad;
  const w = 1000;
  const x0 = (glyph.advance - w) / 2;
  return html`<svg class=${className} viewBox=${`${x0} ${-asc} ${w} ${asc - desc}`} preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    ${baseline && html`<line class="baseline-line" x1=${x0} x2=${x0 + w} y1="0" y2="0" />`}
    <path d=${Core.glyphD(glyph)} fill="currentColor" />
  </svg>`;
});

/** A run of glyphs from the model (live while editing, no compile needed). */
function GlyphRun({ project, seq, height = 72, highlightId, onPick, kern = true, className }) {
  const { items, width } = Core.layoutRun(project, seq, kern);
  const asc = project.info.ascender + 40, desc = project.info.descender - 40;
  const H = asc - desc;
  const W = Math.max(width, 1);
  return html`<svg class=${className} width=${(W / H) * height} height=${height} viewBox=${`0 ${-asc} ${W} ${H}`} role="img" aria-label=${seq.map((s) => s.ch || s.glyph?.name || '').join('')}>
    ${items.map((it, i) => it.missing
      ? html`<rect key=${i} class="run-missing" x=${it.x + 30} y=${-project.info.capHeight} width="220" height=${project.info.capHeight} rx="20" />`
      : html`<path key=${i} class=${cls('run-glyph', it.glyph.id === highlightId && 'hl')} d=${Core.glyphD(it.glyph)}
          transform=${`translate(${it.x} 0)`} onClick=${onPick ? () => onPick(it.glyph.id) : undefined} />`)}
  </svg>`;
}

// ---------- projects dialog ----------
function ProjectsDialog({ open, onClose, projects, current, isDraft, persist, onOpen, onNew, onImport, onDelete }) {
  const ref = useRef(null);

  const [confirm, setConfirm] = useState(null);
  const fileRef = useRef(null);
  const sansPreview = useMemo(() => Core.sansProject('Preview'), []);
  useEffect(() => {
    const d = ref.current;
    if (!d) return;
    if (open && !d.open) { d.showModal(); setConfirm(null); }
    if (!open && d.open) d.close();
  }, [open]);
  const note = persist.mode === 'db' ? 'Saved to your Claude account. Only you can see these.'
    : persist.mode === 'local' ? 'Saved in this browser only. Save a project file from Export to keep a copy.'
    : persist.mode === 'memory' ? 'This view can’t save. Save a project file from Export to keep your work.'
    : 'Connecting to storage…';
  const rows = useMemo(() => {
    const list = projects.filter((p) => p.id !== current.id);
    if (!isDraft) list.unshift({ id: current.id, familyName: current.info.familyName, glyphCount: current.glyphOrder.length, updatedAt: new Date().toISOString() });
    return list;
  }, [projects, current, isDraft]);
  const fam = name.trim() || 'Untitled Sans';
  return html`<dialog ref=${ref} class="drawer" aria-labelledby="proj-title" onClose=${onClose}
      onClick=${(e) => { if (e.target === ref.current) onClose(); }}>
    <div class="drawer-body">

        <button class="btn btn-ghost icon-btn" aria-label="Close" onClick=${onClose}><${Icon} name="x" /></button>
      </div>
      ${rows.length > 0 ? html`<ul class="proj-list">
        ${rows.map((p) => html`<li key=${p.id} class="proj-item" aria-current=${p.id === current.id ? 'true' : 'false'}>
          <button class="proj-open" onClick=${() => onOpen(p.id)}>
            <b>${p.familyName || 'Untitled'}</b>
            <span>${p.glyphCount} glyphs · ${p.id === current.id ? 'open now' : 'edited ' + timeAgo(p.updatedAt)}</span>
          </button>
          ${confirm === p.id
            ? html`<span class="row"><button class="btn btn-sm btn-danger" onClick=${() => { setConfirm(null); onDelete(p.id); }}>Delete</button>
                <button class="btn btn-sm btn-ghost" onClick=${() => setConfirm(null)}>Keep</button></span>`
            : html`<button class="btn btn-ghost icon-btn btn-sm" aria-label=${'Delete ' + p.familyName} onClick=${() => setConfirm(p.id)}><${Icon} name="trash" size=${16} /></button>`}
        </li>`)}
      </ul>` : html`<p class="empty-note">${isDraft ? 'You’re editing the example typeface. It saves as soon as you change something.' : 'No saved typefaces yet.'}</p>`}
      <div style=${{ display: 'grid', gap: '12px' }}>
        <div class="field">
          <label class="label" for="new-name">New typeface</label>
          <input id="new-name" class="input" placeholder="Family name, e.g. Harbor Grotesk" value=${name} onChange=${(e) => setName(e.target.value)} />
        </div>
        <div class="starts">
          <button class="start-card" onClick=${() => { onNew('sans', fam); setName(''); }}>
            <${GlyphRun} project=${sansPreview} seq=${Core.textToSeq(sansPreview, 'Aag')} height=${58} />
            <b>Start from Sans</b><span>78 glyphs, A–Z, a–z, figures, punctuation and starter kerning.</span>
          </button>
          <button class="start-card" onClick=${() => { onNew('blank', fam); setName(''); }}>
            <svg viewBox="0 0 300 100" aria-hidden="true"><line x1="0" x2="300" y1="78" y2="78" stroke="var(--line-strong)" /><line x1="0" x2="300" y1="30" y2="30" stroke="var(--line)" stroke-dasharray="4 4" /></svg>
            <b>Start blank</b><span>Metrics, a space and empty slots for every basic character.</span>
          </button>
        </div>
        <div class="row" style=${{ justifyContent: 'space-between', flexWrap: 'wrap' }}>
          <span class="hint">Have a .typeface.json file from Export?</span>
          <button class="btn" onClick=${() => fileRef.current.click()}><${Icon} name="upload" size=${16} /> Import project</button>
          <input ref=${fileRef} type="file" accept=".json,application/json" hidden onChange=${(e) => { const f = e.target.files[0]; e.target.value = ''; if (f) onImport(f); }} />
        </div>
      </div>
    </div>
  </dialog>`;
}

// ---------- glyph overview ----------
const GlyphTile = memo(function GlyphTile({ glyph, info, onOpen }) {

          <button class="btn" type="submit"><${Icon} name="plus" size=${16} /> Add</button>
        </form>

    </div>

  }
  const marqueeRef = useRef(null); marqueeRef.current = marquee;

  const deleteSelection = () => {
    const g = glyphRef.current, s = selRef.current;
    if (!s.size) return;
    const full = new Set(g.contours.filter((c) => c.nodes.every((n) => s.has(n.id))).map((c) => c.id));
    api.setGlyph(Core.deleteNodes(Core.deleteContours(g, full), s));
    setSel(new Set());
    announce('Deleted');
  };
  const selectedContours = () => {
    const g = glyphRef.current, s = selRef.current;
    const ids = g.contours.filter((c) => c.nodes.some((n) => s.has(n.id))).map((c) => c.id);
    return new Set(ids.length ? ids : g.contours.map((c) => c.id));
  };
  const reverseSel = () => { api.setGlyph(Core.reverseContours(glyphRef.current, selectedContours())); announce('Direction reversed'); };
  const fixDirections = () => { api.setGlyph(Core.correctDirections(glyphRef.current)); announce('Directions corrected'); };
  const mirror = (axis) => api.setGlyph(Core.mirrorContours(glyphRef.current, selectedContours(), axis));

  useEffect(() => {
    const down = (e) => {
      if (isTyping(e.target)) return;
      const mod = e.metaKey || e.ctrlKey, k = e.key, g = glyphRef.current, s = selRef.current;
      if (k === ' ' && (e.target === document.body || e.target === svgRef.current)) { e.preventDefault(); if (!e.repeat) setSpace(true); return; }
      if (mod && k === '0') { e.preventDefault(); fit(); return; }
      if (mod && (k === '=' || k === '+')) { e.preventDefault(); zoomBy(1.25); return; }
      if (mod && k === '-') { e.preventDefault(); zoomBy(0.8); return; }
      if (mod && k.toLowerCase() === 'a') { e.preventDefault(); setSel(new Set(g.contours.flatMap((c) => c.nodes.map((n) => n.id)))); return; }
      if (mod || e.altKey) return;
      if (k === 'v' || k === 'V') chooseTool('select');
      else if (k === 'p' || k === 'P') chooseTool('pen');
      else if (k === 'h' || k === 'H') chooseTool('hand');
      else if (k === 'f' || k === 'F') setPreview((x) => !x);
      else if (k === '[') onNav(-1);
      else if (k === ']') onNav(1);
      else if (k === 'Escape' || k === 'Enter') { if (penRef.current) finishPen(); else if (k === 'Escape') setSel(new Set()); }
      else if (k === 'Backspace' || k === 'Delete') { if (s.size) { e.preventDefault(); deleteSelection(); } }
      else if (k.startsWith('Arrow') && s.size) {
        e.preventDefault();
        const st = e.shiftKey ? 10 : 1;
        const dx = k === 'ArrowLeft' ? -st : k === 'ArrowRight' ? st : 0, dy = k === 'ArrowUp' ? st : k === 'ArrowDown' ? -st : 0;
        api.setGlyph(Core.moveNodes(g, s, dx, dy));
      } else if (k === 'r') reverseSel();
      else if (k === 'R') fixDirections();
    };
    const up = (e) => { if (e.key === ' ') setSpace(false); };
    window.addEventListener('keydown', down);
    window.addEventListener('keyup', up);
    return () => { window.removeEventListener('keydown', down); window.removeEventListener('keyup', up); };
  }, [fit, onNav, tool]);

  if (!glyph) return html`<div class="page"><p class="empty-note">Pick a glyph to edit from the Glyphs tab.</p></div>`;

  // ----- render -----
  const v = vp || { z: 0.5, tx: 0, ty: 0 };
  const S = (x, y) => [v.tx + x * v.z, v.ty - y * v.z];
  const hitR = coarse ? 22 : 9;
  const W = size.w, H = size.h;
  const bb = Core.glyphBBox(glyph);
  const { lsb, rsb } = Core.sidebearings(glyph);
  const showPoints = !preview;
  const open = penId ? glyph.contours.find((c) => c.id === penId) : null;
  const cursor = panning ? 'grabbing' : (tool === 'hand' || space) ? 'grab' : tool === 'pen' ? 'crosshair' : 'default';
  const nodesSel = [];
  for (const c of glyph.contours) for (const n of c.nodes) if (sel.has(n.id)) nodesSel.push(n);
  const selBox = nodesSel.length > 1 ? {
    xMin: Math.min(...nodesSel.map((n) => n.x)), xMax: Math.max(...nodesSel.map((n) => n.x)),
    yMin: Math.min(...nodesSel.map((n) => n.y)), yMax: Math.max(...nodesSel.map((n) => n.y)) } : null;
  const one = nodesSel.length === 1 ? nodesSel[0] : null;
  const cat = Core.categoryOf(glyph);
  const defaultCtx = cat === 'lower' ? 'nn•nn oo•oo' : cat === 'figure' ? '00•11 •0•1•' : cat === 'punct' ? 'HH•HH nn•nn' : 'HH•HH OO•OO';
  const ctx = ctxText ?? defaultCtx;
  const ctxSeq = Array.from(ctx).map((ch) => (ch === '•' ? { ch, glyph } : { ch, glyph: Core.cmapOf(project).get(ch.codePointAt(0)) || null }));
  const validateName = (n) => {
    if (!Core.isValidGlyphName(n)) return 'Use letters, digits, “.” or “_”, starting with a letter.';
    if (Object.values(project.glyphs).some((g) => g.id !== glyph.id && g.name === n)) return 'Another glyph already has this name.';
    return null;
  };
  const parseUni = (t) => {
    const out = [];
    for (const part of t.split(/[,\s]+/).filter(Boolean)) {
      const m = part.match(/^(?:U\+|u\+|0x)?([0-9A-Fa-f]{4,6})$/);
      if (m) out.push(parseInt(m[1], 16));
      else if (Array.from(part).length === 1) out.push(part.codePointAt(0));
      else return null;
    }
    return out;
  };
  const uniStr = glyph.unicodes.map(fmtU).join(', ');
  const validateUni = (t) => {
    const cps = parseUni(t);
    if (!cps) return 'Use codes like U+0041, separated by commas.';
    for (const cp of cps) {
      const owner = Object.values(project.glyphs).find((g) => g.id !== glyph.id && g.unicodes.includes(cp));
      if (owner) return `${fmtU(cp)} already belongs to ${owner.name}.`;
    }
    return null;
  };

  return html`<div class="editor">
    <div class="canvas-wrap" ref=${wrapRef}>
      <svg ref=${svgRef} class="canvas" style=${{ cursor }} role="application" tabIndex="0"
        aria-label=${`Glyph editor for ${glyph.name}. ${tool} tool.`}
        onPointerDown=${onPointerDown} onPointerMove=${onPointerMove}
        onPointerUp=${(e) => onPointerUp(e)} onPointerCancel=${(e) => onPointerUp(e, true)}
        onPointerLeave=${() => setHover(null)}>
        ${vp && html`<g>
          ${METRIC_LINES(info).map(([y, label]) => {
            const sy = Math.round(S(0, y)[1]) + 0.5;
            return html`<g key=${label}>
              <line class=${cls('c-metric', y === 0 && 'base')} x1="0" x2=${W} y1=${sy} y2=${sy} />
              <text class="c-label" x=${W - 12} y=${sy - 5} text-anchor="end">${label} ${y}</text>
            </g>`;
          })}
          ${(() => {
            const [x0] = S(0, 0), [x1] = S(glyph.advance, 0);
            const [, top] = S(0, info.ascender + 40), [, bot] = S(0, info.descender - 40);
            return html`<g>
              <line class="c-metric" x1=${Math.round(x0) + 0.5} x2=${Math.round(x0) + 0.5} y1=${top} y2=${bot} />
              <line class="c-adv-hit" data-hit="advance" x1=${x1} x2=${x1} y1=${top} y2=${bot} />
              <line class=${cls('c-adv', drag.current && drag.current.kind === 'advance' && 'active')} x1=${Math.round(x1) + 0.5} x2=${Math.round(x1) + 0.5} y1=${top} y2=${bot} pointer-events="none" />
              <text class="c-label" x=${x1 + 6} y=${bot - 4}>width ${glyph.advance}</text>
              ${bb && lsb !== null && html`<text class="c-label sb" x=${(x0 + S(bb.xMin, 0)[0]) / 2} y=${S(0, 0)[1] + 16} text-anchor="middle">${lsb}</text>`}
              ${bb && rsb !== null && html`<text class="c-label sb" x=${(x1 + S(bb.xMax, 0)[0]) / 2} y=${S(0, 0)[1] + 16} text-anchor="middle">${rsb}</text>`}
            </g>`;
          })()}
          <g transform=${`matrix(${v.z} 0 0 ${v.z} ${v.tx} ${v.ty})`}>
            <path class=${cls('c-fill', preview && 'solid')} d=${Core.glyphD(glyph)} pointer-events="none" />
            ${showPoints && html`<path class="c-stroke" d=${Core.contoursToD(glyph.contours)} pointer-events="none" />`}
            ${showPoints && glyph.contours.map((c) => Core.segmentsOf(c).map((s, si) => html`<path key=${c.id + si} class="c-seg" data-hit="seg" data-contour=${c.id} data-seg=${si} d=${segPathD(s)} />`))}
          </g>
          ${showPoints && glyph.contours.map((c) => {
            if (c.nodes.length < 2) return null;
            const s0 = Core.segmentsOf(c)[0];
            if (!s0) return null;
            const tgt = s0.type === 'C' && (s0.p1.x !== s0.p0.x || s0.p1.y !== s0.p0.y) ? s0.p1 : s0.type === 'C' ? s0.p2 : s0.p3;
            const [ax, ay] = S(s0.p0.x, s0.p0.y), [bx, by] = S(tgt.x, tgt.y);
            const ang = (Math.atan2(by - ay, bx - ax) * 180) / Math.PI;
            return html`<path key=${'arr' + c.id} class="c-arrow" d="M14 0 L7 -4 L7 4 Z" transform=${`translate(${ax} ${ay}) rotate(${ang})`} pointer-events="none" />`;
          })}
          ${showPoints && glyph.contours.map((c) => c.nodes.map((n) => {
            if (coarse && !sel.has(n.id)) return null;
            const [x, y] = S(n.x, n.y);
            return ['in', 'out'].map((w) => {
              const h = n[w];
              if (!h || (h.x === 0 && h.y === 0)) return null;
              const [hx, hy] = S(n.x + h.x, n.y + h.y);
              return html`<g key=${n.id + w}>
                <line class="c-handle-line" x1=${x} y1=${y} x2=${hx} y2=${hy} />
                <circle class="c-handle" cx=${hx} cy=${hy} r="3.5" />
                <circle class="c-hit" data-hit="handle" data-node=${n.id} data-which=${w} cx=${hx} cy=${hy} r=${hitR - 1} />
              </g>`;
            });
          }))}
          ${showPoints && glyph.contours.map((c) => c.nodes.map((n, i) => {
            const [x, y] = S(n.x, n.y);
            const s = sel.has(n.id);
            const k = cls('c-node', s && 'sel', i === 0 && !s && 'start');
            return html`<g key=${n.id}>
              ${n.type === 'smooth' ? html`<circle class=${k} cx=${x} cy=${y} r="4.2" />` : html`<rect class=${k} x=${x - 4} y=${y - 4} width="8" height="8" />`}
              <circle class="c-hit" data-hit="node" data-node=${n.id} cx=${x} cy=${y} r=${hitR} />
            </g>`;
          }))}
          ${tool === 'pen' && open && hover && (() => {
            const t = open.nodes[open.nodes.length - 1];
            const [ax, ay] = S(t.x, t.y), [hx, hy] = S(hover.x, hover.y);
            const d = t.out ? (() => { const [cx1, cy1] = S(t.x + t.out.x, t.y + t.out.y); return `M${ax} ${ay}C${cx1} ${cy1} ${hx} ${hy} ${hx} ${hy}`; })() : `M${ax} ${ay}L${hx} ${hy}`;
            const f0 = open.nodes[0], [fx, fy] = S(f0.x, f0.y);
            const near = open.nodes.length >= 2 && Math.hypot(hx - fx, hy - fy) < hitR + 2;
            return html`<g pointer-events="none"><path class="c-pen" d=${d} />${near && html`<circle class="c-close" cx=${fx} cy=${fy} r="9" />`}</g>`;
          })()}
          ${marquee && html`<rect class="c-marquee" x=${Math.min(marquee.x0, marquee.x1)} y=${Math.min(marquee.y0, marquee.y1)} width=${Math.abs(marquee.x1 - marquee.x0)} height=${Math.abs(marquee.y1 - marquee.y0)} />`}
        </g>`}
      </svg>

      <div class="toolrail glass" role="toolbar" aria-label="Tools" aria-orientation="vertical">
        ${[['select', 'Select', 'V'], ['pen', 'Pen', 'P'], ['hand', 'Hand', 'H']].map(([t, label, key]) => html`<button key=${t} class="tool"
          aria-pressed=${tool === t ? 'true' : 'false'} aria-keyshortcuts=${key} title=${`${label} (${key})`} aria-label=${label} onClick=${() => chooseTool(t)}>
          <${Icon} name=${t} size=${19} /></button>`)}
        <div class="rule"></div>
        <button class="tool" aria-pressed=${preview ? 'true' : 'false'} title="Preview filled (F)" aria-label="Preview filled" onClick=${() => setPreview((x) => !x)}><${Icon} name="eye" size=${19} /></button>
        <button class="tool" title="Fit to window (⌘0)" aria-label="Fit to window" onClick=${fit}><${Icon} name="fit" size=${19} /></button>
      </div>
      <div class="glyph-head glass">
        <button class="btn btn-ghost icon-btn btn-sm" aria-label="Previous glyph" title="Previous glyph ([)" onClick=${() => onNav(-1)}><${Icon} name="left" size=${16} /></button>
        <span class="gname"><b>${glyph.name}</b><span>${glyph.unicodes.length ? fmtU(glyph.unicodes[0]) : 'unencoded'}</span></span>
        <button class="btn btn-ghost icon-btn btn-sm" aria-label="Next glyph" title="Next glyph (])" onClick=${() => onNav(1)}><${Icon} name="right" size=${16} /></button>
      </div>
      <button class="btn glass sheet-btn" onClick=${() => setSheet((x) => !x)} aria-expanded=${sheet ? 'true' : 'false'} aria-controls="inspector"><${Icon} name="sliders" size=${16} /> Details</button>
      <div class="zoom-pill glass">
        <button class="btn btn-ghost icon-btn btn-sm" aria-label="Zoom out" onClick=${() => zoomBy(0.8)}><${Icon} name="minus" size=${15} /></button>
        <output aria-live="off">${Math.round(v.z * 100)}%</output>
        <button class="btn btn-ghost icon-btn btn-sm" aria-label="Zoom in" onClick=${() => zoomBy(1.25)}><${Icon} name="plus" size=${15} /></button>
      </div>
    </div>

    <aside class=${cls('inspector', sheet && 'open')} id="inspector" aria-label="Glyph details">
      <section class="insp-sec">
        <header><span class="label">Glyph</span>${sheet && html`<button class="btn btn-ghost icon-btn btn-sm" aria-label="Close details" onClick=${() => setSheet(false)}><${Icon} name="x" size=${15} /></button>`}</header>
        <div class="grid2">
          <${TextField} id="g-name" label="Name" mono value=${glyph.name} validate=${validateName}
            onCommit=${(n) => { api.setGlyph({ ...glyph, name: n }); }} />
          <${TextField} id="g-uni" label="Unicode" mono value=${uniStr} validate=${validateUni} placeholder="none"
            onCommit=${(t) => api.setGlyph({ ...glyph, unicodes: parseUni(t) || [] })} />
        </div>
        <div class="grid2">
          <div class="field"><label class="label" for="g-adv">Width</label>
            <${NumField} id="g-adv" label="Advance width" value=${glyph.advance} min=${0} max=${4000} onCommit=${(a) => api.setGlyph({ ...glyph, advance: a })} /></div>
          <div class="field"><span class="label">Bounds</span><span class="input mono" style=${{ display: 'flex', alignItems: 'center', color: 'var(--muted)' }}>${bb ? `${Math.round(bb.xMax - bb.xMin)} × ${Math.round(bb.yMax - bb.yMin)}` : 'empty'}</span></div>
        </div>
        <div class="grid2">
          <div class="field"><label class="label" for="g-lsb">Left side</label>
            <${NumField} id="g-lsb" label="Left side bearing" value=${lsb} disabled=${lsb === null} onCommit=${(x) => api.setGlyph(Core.setLsb(glyph, x))} /></div>
          <div class="field"><label class="label" for="g-rsb">Right side</label>
            <${NumField} id="g-rsb" label="Right side bearing" value=${rsb} disabled=${rsb === null} onCommit=${(x) => api.setGlyph(Core.setRsb(glyph, x))} /></div>
        </div>
      </section>
      <section class="insp-sec">
        <header><span class="label">${one ? 'Point' : selBox ? nodesSel.length + ' points' : 'Selection'}</span></header>
        ${one ? html`<div class="grid2">
            <div class="field"><label class="label" for="p-x">X</label><${NumField} id="p-x" label="Point X" value=${one.x} onCommit=${(x) => api.setGlyph(Core.moveNodes(glyph, sel, x - one.x, 0))} /></div>
            <div class="field"><label class="label" for="p-y">Y</label><${NumField} id="p-y" label="Point Y" value=${one.y} onCommit=${(y) => api.setGlyph(Core.moveNodes(glyph, sel, 0, y - one.y))} /></div>
          </div>
          <div class="seg" role="group" aria-label="Point type">
            <button aria-pressed=${one.type === 'corner' ? 'true' : 'false'} onClick=${() => one.type !== 'corner' && api.setGlyph(Core.toggleSmooth(glyph, one.id))}>Corner</button>
            <button aria-pressed=${one.type === 'smooth' ? 'true' : 'false'} onClick=${() => one.type !== 'smooth' && api.setGlyph(Core.toggleSmooth(glyph, one.id))}>Smooth</button>
          </div>`
        : selBox ? html`<div class="grid2">
            <div class="field"><label class="label" for="s-x">X</label><${NumField} id="s-x" label="Selection left" value=${Math.round(selBox.xMin)} onCommit=${(x) => api.setGlyph(Core.moveNodes(glyph, sel, x - Math.round(selBox.xMin), 0))} /></div>
            <div class="field"><label class="label" for="s-y">Y</label><${NumField} id="s-y" label="Selection bottom" value=${Math.round(selBox.yMin)} onCommit=${(y) => api.setGlyph(Core.moveNodes(glyph, sel, 0, y - Math.round(selBox.yMin)))} /></div>
          </div>`
        : html`<p class="hint">${tool === 'pen' ? 'Click to place points. Drag to pull out curve handles. Click the first point to close the shape.' : 'Click a point or a shape to select it. Drag on empty space to select several.'}</p>`}
      </section>
      <section class="insp-sec">
        <header><span class="label">Contours</span><span class="hint mono">${glyph.contours.length}</span></header>
        <div class="actions">
          <button class="btn btn-sm" onClick=${reverseSel} title="Reverse direction (R)"><${Icon} name="reverse" size=${15} /> Reverse</button>
          <button class="btn btn-sm" onClick=${fixDirections} title="Correct all directions (Shift R)"><${Icon} name="reverse" size=${15} /> Fix all</button>
          <button class="btn btn-sm" onClick=${() => mirror('x')}><${Icon} name="flipH" size=${15} /> Flip ↔</button>
          <button class="btn btn-sm" onClick=${() => mirror('y')}><${Icon} name="flipV" size=${15} /> Flip ↕</button>
          <button class="btn btn-sm btn-danger" disabled=${!sel.size} onClick=${deleteSelection}><${Icon} name="trash" size=${15} /> Delete</button>
        </div>
      </section>
      <section class="insp-sec">
        <header><span class="label">Keys</span></header>
        <dl class="keys">
          <dt><span class="kbd">V</span> <span class="kbd">P</span> <span class="kbd">H</span></dt><dd>Select, pen, hand</dd>
          <dt><span class="kbd">Alt</span> click</dt><dd>Corner ↔ smooth point</dd>
          <dt><span class="kbd">←</span> <span class="kbd">→</span></dt><dd>Nudge 1, with Shift 10</dd>
          <dt><span class="kbd">⌘Z</span></dt><dd>Undo, with Shift redo</dd>
          <dt><span class="kbd">[</span> <span class="kbd">]</span></dt><dd>Previous / next glyph</dd>
          <dt><span class="kbd">F</span></dt><dd>Filled preview</dd>
          <dt><span class="kbd">Space</span></dt><dd>Hold and drag to pan</dd>
          <dt><span class="kbd">⌘</span> scroll</dt><dd>Zoom</dd>
        </dl>
      </section>
    </aside>

    <div class="strip">
      <input class="input mono" aria-label="Context text, • is this glyph" value=${ctx} onChange=${(e) => setCtxText(e.target.value)} title="Type around the glyph. • stands for the glyph you’re editing." />
      <div class="run-scroll"><${GlyphRun} project=${project} seq=${ctxSeq} height=${68} highlightId=${glyph.id} onPick=${onPick} /></div>
    </div>
  </div>`;
}

// ---------- spacing & kerning ----------
const COMMON_PAIRS = ['AV', 'AW', 'AY', 'AT', 'AO', 'AC', 'AU', 'FA', 'FO', 'LT', 'LV', 'LW', 'LY', 'LO', 'PA', 'RT', 'RV', 'RY', 'TA', 'TO', 'Ta', 'Tc', 'Te', 'To', 'Tr', 'Ts', 'Tu', 'Tw', 'Ty', 'VA', 'Va', 'Ve', 'Vo', 'WA', 'Wa', 'We', 'Wo', 'YA', 'Ya', 'Ye', 'Yo', 'Yu', 'av', 'aw', 'ay', 'kc', 'ke', 'ko', 'rc', 're', 'ro', 'r.', 'r,', 'v.', 'w.', 'y.', 'y,', 'T.', 'T,', 'V.', 'W.', 'Y.', 'P.', 'F.', "L'", 'f.'];

function KerningPanel({ project, api, font }) {
  const cmap = Core.cmapOf(project);
  const [selKey, setSelKey] = useState(() => Object.keys(project.kerning)[0] || null);
  const [addTxt, setAddTxt] = useState('');
  const [addErr, setAddErr] = useState(null);
  const [filter, setFilter] = useState('');
  const stageRef = useRef(null);
  const dragRef = useRef(null);
  const g = (id) => project.glyphs[id];
  const pairs = Object.entries(project.kerning)
    .map(([k, v]) => { const [a, b] = k.split('|'); return { k, a: g(a), b: g(b), v }; })
    .filter((p) => p.a && p.b)
    .sort((x, y) => (x.a.name + ' ' + x.b.name).localeCompare(y.a.name + ' ' + y.b.name));
  const label = (gl) => glyphChar(gl) && gl.name !== 'space' ? glyphChar(gl) : '/' + gl.name;
  const shown = pairs.filter((p) => !filter || (label(p.a) + label(p.b)).includes(filter) || (p.a.name + ' ' + p.b.name).toLowerCase().includes(filter.toLowerCase()));
  const cur = selKey && project.kerning[selKey] !== undefined ? pairs.find((p) => p.k === selKey) : null;
  const setKern = (k, v, record = true) => {
    const kerning = { ...project.kerning };
    if (v === null) delete kerning[k]; else kerning[k] = Math.max(-1000, Math.min(1000, Math.round(v)));
    api.commit({ ...api.get(), kerning }, record);
  };
  const resolve = (txt) => {
    const t = txt.trim();
    const names = t.startsWith('/') ? t.split('/').filter(Boolean) : null;
    if (names && names.length === 2) {
      const find = (n) => Object.values(project.glyphs).find((x) => x.name === n);
      return [find(names[0]), find(names[1])];
    }
    const chars = Array.from(t);
    if (chars.length === 2) return chars.map((c) => cmap.get(c.codePointAt(0)));
    return null;
  };
  const addPair = (txt) => {
    const r = resolve(txt);
    if (!r) { setAddErr('Type two characters, like AV, or two names, like /T/period.'); return; }
    if (!r[0] || !r[1]) { setAddErr('One of those characters isn’t in the font yet.'); return; }
    const k = r[0].id + '|' + r[1].id;
    if (project.kerning[k] === undefined) setKern(k, 0);
    setSelKey(k); setAddTxt(''); setAddErr(null);
  };
  const suggestions = COMMON_PAIRS.map((s) => {
    const [a, b] = Array.from(s).map((c) => cmap.get(c.codePointAt(0)));
    return a && b && !Core.isEmpty(a) && !Core.isEmpty(b) && project.kerning[a.id + '|' + b.id] === undefined ? { s, k: a.id + '|' + b.id } : null;
  }).filter(Boolean).slice(0, 12);

  // preview geometry
  const lowerCtx = cur && Core.categoryOf(cur.b) === 'lower';
  const ctxG = (ch) => cmap.get(ch.codePointAt(0));
  const pad = lowerCtx ? 'n' : 'H';
  const seq = cur ? [{ glyph: ctxG(pad) }, { glyph: ctxG(pad) }, { glyph: cur.a, mark: 'a' }, { glyph: cur.b, mark: 'b' }, { glyph: ctxG(pad) }, { glyph: ctxG(pad) }].map((s) => ({ ...s, glyph: s.glyph || null })) : [];
  const run = cur ? Core.layoutRun(project, seq) : null;
  const asc = project.info.ascender + 60, desc = project.info.descender - 60;
  const onStageDown = (e) => {
    if (!cur) return;
    const el = e.target.closest('[data-kern-drag]');
    if (!el) return;
    e.currentTarget.setPointerCapture(e.pointerId);
    const svg = stageRef.current, r = svg.getBoundingClientRect();
    const unitsPerPx = (run.width + 200) / r.width;
    const scale = Math.max(unitsPerPx, (asc - desc) / r.height);
    api.begin();
    dragRef.current = { x: e.clientX, v0: cur.v, scale };
  };
  const onStageMove = (e) => {
    const d = dragRef.current;
    if (!d) return;
    let v = d.v0 + (e.clientX - d.x) * d.scale;
    v = e.shiftKey ? Math.round(v) : Math.round(v / 5) * 5;
    setKern(cur.k, v, false);
  };
  const onStageUp = () => { if (dragRef.current) { dragRef.current = null; api.end(); } };

  return html`<div class="split">
    <section class="card pairs" aria-label="Kerning pairs">
      <form class="field" onSubmit=${(e) => { e.preventDefault(); addPair(addTxt); }}>
        <label class="label" for="kern-add">Add a pair</label>
        <div class="row">
          <input id="kern-add" class="input mono" placeholder="AV or /T/period" value=${addTxt} aria-invalid=${addErr ? 'true' : 'false'} onChange=${(e) => { setAddTxt(e.target.value); setAddErr(null); }} />
          <button class="btn" type="submit"><${Icon} name="plus" size=${16} /> Add</button>
        </div>
        ${addErr && html`<span class="err" role="alert">${addErr}</span>`}
      </form>
      ${suggestions.length > 0 && html`<div class="field"><span class="label">Often needed</span>
        <div class="chips">${suggestions.map((s) => html`<button key=${s.s} class="chip mono" onClick=${() => addPair(s.s)}>${s.s}</button>`)}</div></div>`}
      <div class="field">
        <div class="row" style=${{ justifyContent: 'space-between' }}><span class="label">${pairs.length} pairs</span>
          <input class="input" style=${{ width: '120px', height: '28px', fontSize: '12px' }} aria-label="Filter pairs" placeholder="Filter" value=${filter} onChange=${(e) => setFilter(e.target.value)} /></div>
        ${pairs.length === 0 ? html`<p class="empty-note">No kerning pairs yet. Type two letters above, like AV, to add one.</p>` : html`<div class="pair-list" role="listbox" aria-label="Kerning pairs">
          ${shown.map((p) => html`<div key=${p.k} class="pair-row" role="option" aria-selected=${p.k === selKey ? 'true' : 'false'}>
            <button class="pair-name" onClick=${() => setSelKey(p.k)}>${label(p.a)}${label(p.b)} <span style=${{ color: 'var(--faint)' }}>${p.a.name} ${p.b.name}</span></button>
            <${NumField} label=${`Kerning ${p.a.name} ${p.b.name}`} value=${p.v} step=${5} onCommit=${(v) => { setSelKey(p.k); setKern(p.k, v); }} />
            <button class="btn btn-ghost icon-btn btn-sm" aria-label=${`Remove ${p.a.name} ${p.b.name}`} onClick=${() => setKern(p.k, null)}><${Icon} name="x" size=${14} /></button>
          </div>`)}
        </div>`}
      </div>
    </section>
    <section class="card preview-card" aria-label="Kerning preview">
      ${cur ? html`
        <div class="toolbar-row">
          <div style=${{ display: 'grid', gap: '6px' }}>
            <span class="eyebrow">${cur.a.name} + ${cur.b.name}</span>
            <span class="kern-value" aria-live="polite">${cur.v > 0 ? '+' : ''}${cur.v}</span>
          </div>
          <div class="row" role="group" aria-label="Adjust kerning">
            <button class="btn btn-sm mono" onClick=${() => setKern(cur.k, cur.v - 10)}>−10</button>
            <button class="btn btn-sm mono" onClick=${() => setKern(cur.k, cur.v - 1)}>−1</button>
            <button class="btn btn-sm mono" onClick=${() => setKern(cur.k, cur.v + 1)}>+1</button>
            <button class="btn btn-sm mono" onClick=${() => setKern(cur.k, cur.v + 10)}>+10</button>
            <button class="btn btn-sm btn-ghost btn-danger" onClick=${() => setKern(cur.k, null)}>Remove</button>
          </div>
        </div>
        <div class="kern-stage" tabIndex="0" aria-label="Drag the right letter, or use the arrow keys, to kern"
          onKeyDown=${(e) => { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); setKern(cur.k, cur.v + (e.key === 'ArrowLeft' ? -1 : 1) * (e.shiftKey ? 1 : 5)); } }}
          onPointerDown=${onStageDown} onPointerMove=${onStageMove} onPointerUp=${onStageUp} onPointerCancel=${onStageUp}>
          <svg ref=${stageRef} viewBox=${`-100 ${-asc} ${run.width + 200} ${asc - desc}`} preserveAspectRatio="xMidYMid meet" role="img" aria-label=${`${cur.a.name} ${cur.b.name} kerned ${cur.v}`}>
            <line x1="-100" x2=${run.width + 100} y1="0" y2="0" stroke="var(--metric)" vector-effect="non-scaling-stroke" />
            ${run.items.map((it, i) => it.missing ? null : html`<path key=${i} d=${Core.glyphD(it.glyph)} transform=${`translate(${it.x} 0)`}
              class=${it.mark === 'b' ? 'drag-glyph' : ''} data-kern-drag=${it.mark === 'b' ? '1' : undefined}
              fill=${it.mark ? 'var(--accent)' : 'var(--ink)'} />`)}
          </svg>
        </div>
        <p class="hint">Drag the right letter or use ← → (5 units, Shift for 1). The line below uses the compiled font.</p>`
      : html`<p class="empty-note">Pick a pair from the list, or add one, to see it here.</p>`}
      <div class="proof uf" style=${{ fontFamily: fontStack(font) }}>AVATAR Toyota WAVE. LYNX Type, Py.</div>
    </section>
  </div>`;
}

function SpacingPanel({ project, api }) {
  const [q, setQ] = useState('');
  const [focus, setFocus] = useState(null);
  const glyphs = project.glyphOrder.map((id) => project.glyphs[id]).filter((g) => g && g.name !== '.notdef' && (!q || g.name.toLowerCase().includes(q.toLowerCase()) || glyphChar(g) === q));
  const cmap = Core.cmapOf(project);
  const fg = focus && project.glyphs[focus];
  const ctx = fg ? (Core.categoryOf(fg) === 'lower' ? 'nn•nn oo•oo' : 'HH•HH OO•OO') : 'HHOHH nnonn';
  const seq = Array.from(ctx).map((ch) => (ch === '•' ? { ch, glyph: fg } : { ch, glyph: cmap.get(ch.codePointAt(0)) || null }));
  const set = (g, next) => { setFocus(g.id); api.setGlyph(next); };
  return html`<section class="card" style=${{ display: 'grid', gap: '14px', padding: '18px', minWidth: 0 }}>
    <div class="toolbar-row">
      <div class="run-scroll" style=${{ minHeight: '80px' }}><${GlyphRun} project=${project} seq=${seq} height=${80} highlightId=${fg && fg.id} /></div>
      <input class="input" style=${{ width: '170px' }} aria-label="Filter glyphs" placeholder="Filter glyphs" value=${q} onChange=${(e) => setQ(e.target.value)} />
    </div>
    <div style=${{ overflow: 'auto', maxHeight: '520px' }}>
      <table class="sp-table">
        <thead><tr><th>Glyph</th><th>Left</th><th>Right</th><th>Width</th></tr></thead>
        <tbody>${glyphs.map((g) => {
          const { lsb, rsb } = Core.sidebearings(g);
          return html`<tr key=${g.id} onFocus=${() => setFocus(g.id)}>
            <td><span class="sp-glyph"><${GlyphSvg} glyph=${g} info=${project.info} baseline=${false} /><span class="mono">${g.name}</span></span></td>
            <td><${NumField} label=${'Left side of ' + g.name} value=${lsb} disabled=${lsb === null} onCommit=${(x) => set(g, Core.setLsb(g, x))} /></td>
            <td><${NumField} label=${'Right side of ' + g.name} value=${rsb} disabled=${rsb === null} onCommit=${(x) => set(g, Core.setRsb(g, x))} /></td>
            <td><${NumField} label=${'Width of ' + g.name} value=${g.advance} min=${0} onCommit=${(x) => set(g, { ...g, advance: x })} /></td>
          </tr>`;
        })}</tbody>
      </table>
    </div>
  </section>`;
}

function ExportView({ project, api, font, downloads, toast, persistMode }) {
  const info = project.info;
  const names = Core.styleNames(info);
  const setInfo = (patch) => api.commit({ ...api.get(), info: { ...api.get().info, ...patch } });
  const [busy, setBusy] = useState(false);
  const save = async (filename, data) => {
    if (!downloads) { toast('Saving files works when this page is open on claude.ai.'); return; }
    setBusy(true);
    try {
      await downloads.save({ filename, data });
      toast('Saved ' + filename);
    } catch (e) {
      const code = e && e.code;
      toast(code === 'declined' ? 'Save cancelled.' : code === 'rate_limited' ? 'A save is already waiting for you to confirm.' : 'The file didn’t save (' + (code || 'error') + ').');
    } finally { setBusy(false); }
  };
  const saveFont = () => {
    let res;
    try { res = Core.compileFont(api.get()); } catch (e) { toast('The font didn’t build: ' + e.message); return; }
    save(res.fileName, new Blob([res.bytes], { type: 'font/ttf' }));
  };
  const saveProject = () => {
    const p = api.get();
    const slug = (p.info.familyName || 'typeface').trim().replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'typeface';
    save(slug + '.typeface.json', Core.exportProjectJSON(p));
  };
  const diags = font.diagnostics || [];
  const m = [[info.ascender, 'ascender'], [info.capHeight, 'cap'], [info.xHeight, 'x-height'], [0, 'baseline'], [info.descender, 'descender']];
  const cmap = Core.cmapOf(project);
  const H = cmap.get(72), x = cmap.get(120);
  return html`<div class="page">
    <header class="hero">

          <${TextField} id="i-designer" label="Designer" value=${info.designer} placeholder="Your name" onCommit=${(t) => setInfo({ designer: t })} />
        </div>
        <div class="grid2">
          <div class="field"><label class="label" for="i-weight">Weight</label>
            <select id="i-weight" class="input" value=${info.weight} onChange=${(e) => setInfo({ weight: +e.target.value })}>
              ${Object.entries(Core.WEIGHT_NAMES).map(([w, n]) => html`<option key=${w} value=${w}>${w} · ${n}</option>`)}
            </select></div>
          <div class="field"><span class="label">Style</span>
            <label class="switch" style=${{ height: '34px' }}><input type="checkbox" checked=${info.italic} onChange=${(e) => setInfo({ italic: e.target.checked })} /> Italic</label></div>
        </div>
        <div class="grid2">
          <div class="field"><label class="label" for="i-vmaj">Version</label>
            <div class="row"><${NumField} id="i-vmaj" label="Major version" value=${info.versionMajor} min=${0} max=${999} onCommit=${(v) => setInfo({ versionMajor: v })} />
            <span class="mono" aria-hidden="true">.</span>
            <${NumField} label="Minor version" value=${info.versionMinor} min=${0} max=${999} onCommit=${(v) => setInfo({ versionMinor: v })} /></div>
            <span class="hint">Raise this before reinstalling, so your computer picks up the new build.</span></div>
          <div class="field"><span class="label">Style name</span><span class="input mono" style=${{ display: 'flex', alignItems: 'center', color: 'var(--muted)' }}>${names.typoStyle}</span></div>
        </div>
        <div style=${{ display: 'grid', gap: '12px' }}>
          <span class="label">Vertical metrics (font units)</span>
          <div class="grid2">
            <div class="field"><label class="label" for="i-asc">Ascender</label><${NumField} id="i-asc" label="Ascender" value=${info.ascender} min=${1} max=${2000} onCommit=${(v) => setInfo({ ascender: v })} /></div>
            <div class="field"><label class="label" for="i-cap">Cap height</label><${NumField} id="i-cap" label="Cap height" value=${info.capHeight} min=${1} max=${2000} onCommit=${(v) => setInfo({ capHeight: v })} /></div>
            <div class="field"><label class="label" for="i-xh">x-height</label><${NumField} id="i-xh" label="x-height" value=${info.xHeight} min=${1} max=${2000} onCommit=${(v) => setInfo({ xHeight: v })} /></div>
            <div class="field"><label class="label" for="i-desc">Descender</label><${NumField} id="i-desc" label="Descender" value=${info.descender} min=${-2000} max=${0} onCommit=${(v) => setInfo({ descender: v })} /></div>

              <text x="2740" y=${-y - 16} text-anchor="end" font-size="52" fill="var(--metric-label)" font-family="Geist Mono, monospace">${l} ${y}</text></g>`)}
            ${H && html`<path d=${Core.glyphD(H)} fill="var(--ink)" transform="translate(40 0)" />`}
